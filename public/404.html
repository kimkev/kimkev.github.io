<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kevin Kim</title>
    <script>
      // GitHub Pages has no SPA rewrites: remember the requested path and send
      // the browser to the app shell, which restores it with history.replaceState.
      sessionStorage.setItem(
        'spa-redirect',
        window.location.pathname + window.location.search + window.location.hash,
      );
      window.location.replace('/');
    </script>
  </head>
  <body>
    <p>Redirecting… <a href="/">Continue to kimkev.github.io</a></p>
  </body>
</html>
